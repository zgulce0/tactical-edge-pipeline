
services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: sensordata
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d sensordata"]
      interval: 5s
      timeout: 5s
      retries: 10

  sensor-simulator:
    build: ../../services/sensor-simulator
    container_name: sensor-simulator
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: admin
      RABBITMQ_PASS: admin123
      QUEUE_NAME: sensor_data
      SEND_INTERVAL: 2
      DEVICE_ID: sensor-001
    depends_on:
      rabbitmq:
        condition: service_healthy

  worker:
    build: ../../services/worker
    container_name: worker
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: admin
      RABBITMQ_PASS: admin123
      QUEUE_NAME: sensor_data
      DB_HOST: postgres
      DB_NAME: sensordata
      DB_USER: admin
      DB_PASS: admin123
      TEMPERATURE_THRESHOLD: 40
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  pgdata: